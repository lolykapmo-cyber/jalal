services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Preferences and the upload cache survive a rebuild.
      - ./data:/app/data
      # Optional: cookies for login-walled content, mounted read-only.
      - ./cookies.txt:/app/cookies.txt:ro
    environment:
      WORK_DIR: /app/downloads
      DATABASE_PATH: /app/data/bot.sqlite3
    # Downloads are scratch; tmpfs keeps them off the disk entirely.
    tmpfs:
      - /app/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Uncomment to lift the upload ceiling from 50 MB to 2 GB. Get api_id and
  # api_hash from https://my.telegram.org, then set in .env:
